slam_toolbox:
  ros__parameters:
    # 시뮬레이션 필수 설정
    use_sim_time: true
    
    # 매핑 모드
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    provide_odom_frame: false
    scan_topic: /scan
    
    # 스캔 처리
    resolution: 0.05
    max_laser_range: 10.0
    min_laser_range: 0.1
    scan_queue_size: 10
    max_update_rate_hz: 10.0
    
    # TF
    transform_timeout: 2.0  # 2초 타임아웃
    tf_buffer_duration: 60.0  # 60초 캐시 (기본 10초 → 확대)
    transform_publish_period_sec: 0.05  # 0.1→0.05 빠른 TF 발행
    
    # 매칭 및 루프
    use_scan_matching_2d: true
    enable_loop_closure: true
    publish_period_sec: 0.1
    
    # 디버깅
    debug_logging: false
    throttle_scans: 1
    minimum_time_interval: 0.05
